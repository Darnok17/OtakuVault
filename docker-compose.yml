services:
  postgres:
    image: postgres:16-alpine
    container_name: otakuvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: otaku
      POSTGRES_PASSWORD: otaku
      POSTGRES_DB: otakuvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otaku -d otakuvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
